[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mission-foundry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pint>=0.24,<1", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
