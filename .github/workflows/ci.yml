name: Engineering regression
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mission_foundry_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install --no-deps -e backend
          npm ci --prefix frontend
      - name: Backend static checks and SQLite regression
        run: |
          .venv/bin/ruff check backend
          .venv/bin/ruff format --check backend
          .venv/bin/pytest backend/tests -q
      - name: Migrate and test PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mission_foundry_ci
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mission_foundry_ci
        run: |
          (cd backend && ../.venv/bin/alembic upgrade head)
          .venv/bin/pytest backend/tests -q
      - name: Frontend validation
        run: |
          npm run format:check --prefix frontend
          npm run build --prefix frontend
          npm test --prefix frontend
      - name: Browser workflow and design-change acceptance
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
